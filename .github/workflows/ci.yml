name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Lint & PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer ci:composer:validate

      - name: Lint PHP
        run: composer ci:php:lint

      - name: PHPStan
        run: composer ci:php:stan

  tests:
    name: Tests (PHP ${{ matrix.php }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    env:
      typo3DatabaseDriver: pdo_sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Unit tests
        run: composer ci:tests:unit

      - name: Functional tests
        run: composer ci:tests:functional

  functional-databases:
    name: Functional tests (PHP 8.3, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: MariaDB 10.11
            driver: mysqli
            port: 3306
          - database: MySQL 8.0
            driver: mysqli
            port: 3307
          - database: PostgreSQL 16
            driver: pdo_pgsql
            port: 5432
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      typo3DatabaseDriver: ${{ matrix.driver }}
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: ${{ matrix.port }}
      typo3DatabaseName: typo3
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, pdo_pgsql
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Functional tests
        run: composer ci:tests:functional

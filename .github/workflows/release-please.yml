# Versioning follows the TYPO3 major version (13.x = TYPO3 13, 12.x = TYPO3 12).
# release-please only bumps the minor version (see release-please-config.json).
# A new major version is set explicitly with a "Release-As: x.y.z" commit footer.
on:
  push:
    branches:
      - master
      - v12

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
